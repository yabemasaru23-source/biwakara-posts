<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>びわから基金 投稿デスク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style id="app-style">
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface2:#E9EDE8; --surface3:#DDE4DD;
  --ink:#1A2420; --ink2:#56635C; --line:#D3DAD4;
  --accent:#B4661B; --accent-soft:#F5E6D5; --on-accent:#FFFFFF;
  --leaf:#2F5D50; --ok:#2F6D4F; --hold:#7A6E60; --over:#A33B22;
  --flag:#8A6A12; --flag-soft:#F7EED6;
  --shadow:0 1px 2px rgba(26,36,32,.05),0 8px 24px rgba(26,36,32,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121815; --surface:#1A231F; --surface2:#222E28; --surface3:#2A3830;
    --ink:#E8EEE9; --ink2:#9BAAA1; --line:#2E3B34;
    --accent:#E0A264; --accent-soft:#33261A; --on-accent:#171310;
    --leaf:#7FB9A5; --ok:#79BE96; --hold:#A29686; --over:#E38A6E;
    --flag:#D9BC6B; --flag-soft:#2E2716;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1A231F; --surface2:#222E28; --surface3:#2A3830;
  --ink:#E8EEE9; --ink2:#9BAAA1; --line:#2E3B34;
  --accent:#E0A264; --accent-soft:#33261A; --on-accent:#171310;
  --leaf:#7FB9A5; --ok:#79BE96; --hold:#A29686; --over:#E38A6E;
  --flag:#D9BC6B; --flag-soft:#2E2716;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
#root{max-width:1060px;margin:0 auto;padding:40px 24px 96px;display:flex;flex-direction:column;gap:36px}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.eyebrow{font-family:"Roboto Mono",ui-monospace,monospace;font-size:11px;
  letter-spacing:.16em;color:var(--ink2)}
h1{font-family:"Shippori Mincho",serif;font-weight:600;
  font-size:clamp(28px,4.4vw,40px);line-height:1.35;text-wrap:balance}
h2{font-family:"Shippori Mincho",serif;font-weight:600;font-size:21px;line-height:1.5}
.lede{color:var(--ink2);max-width:64ch}

.head{display:flex;flex-direction:column;gap:16px;border-bottom:1px solid var(--line);padding-bottom:26px}
.accounts{display:flex;flex-wrap:wrap;gap:10px}
.acct{display:flex;align-items:center;gap:9px;text-decoration:none;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:8px 13px;box-shadow:var(--shadow)}
.acct:hover{border-color:var(--accent)}
.acct b{font-weight:700;font-size:13px}
.acct .handle{font-family:"Roboto Mono",monospace;font-size:12px;color:var(--ink2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.savebar{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink2);
  background:var(--surface2);border-radius:8px;padding:8px 12px;align-self:flex-start}
.savebar .dot{background:var(--accent)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:15px 17px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.tile .n{font-family:"Roboto Mono",monospace;font-size:26px;font-weight:500;
  font-variant-numeric:tabular-nums;line-height:1.15}
.tile .k{font-size:11.5px;color:var(--ink2)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{padding:10px 18px;font-size:14px;color:var(--ink2);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tabs button:hover:not(.on){color:var(--ink)}

section{display:flex;flex-direction:column;gap:18px}
.sechead{display:flex;flex-direction:column;gap:5px}

.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:18px;display:grid;grid-template-columns:172px 1fr;gap:18px;
  box-shadow:var(--shadow);align-items:start}
.card.noimg{grid-template-columns:1fr}
.card.chosen{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.card.passed{opacity:.5}
.card.done{border-color:var(--ok)}
.thumb{width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface2);
  border:1px solid var(--line);display:block;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.cardtop{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.idx{font-family:"Roboto Mono",monospace;font-size:12px;color:var(--accent);font-weight:500}
.name{font-family:"Shippori Mincho",serif;font-size:17px;font-weight:600}
.when{font-family:"Roboto Mono",monospace;font-size:11.5px;color:var(--ink2);margin-left:auto}

.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:500;
  border-radius:999px;padding:2px 10px;border:1px solid currentColor;white-space:nowrap}
.chip.c-none{color:var(--ink2)}
.chip.c-ok{color:var(--ok)}
.chip.c-hold{color:var(--hold)}
.chip.c-posted{color:var(--leaf)}
.chip.c-pick{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.chip.c-edit{color:var(--accent)}

.mediatabs{display:flex;gap:6px}
.mediatabs button{font-size:12px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;
  color:var(--ink2)}
.mediatabs button.on{background:var(--accent-soft);color:var(--accent);
  border-color:transparent;font-weight:700}

.body{white-space:pre-wrap;font-size:15px;line-height:1.95;background:var(--surface2);
  border-radius:10px;padding:15px 16px;overflow-wrap:anywhere}
.tagline{font-size:12.5px;color:var(--leaf);line-height:1.8;overflow-wrap:anywhere}
textarea{width:100%;min-height:190px;background:var(--surface2);color:var(--ink);
  border:1px solid var(--accent);border-radius:10px;padding:15px 16px;
  font-family:inherit;font-size:15px;line-height:1.95;resize:vertical}

.meter{display:flex;flex-direction:column;gap:5px}
.meter .row{display:flex;justify-content:space-between;gap:10px;
  font-family:"Roboto Mono",monospace;font-size:11.5px;color:var(--ink2);
  font-variant-numeric:tabular-nums}
.track{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:2px}
.fill.over{background:var(--over)}
.meter.over .row{color:var(--over)}

.flag{background:var(--flag-soft);border-left:2px solid var(--flag);border-radius:0 8px 8px 0;
  padding:10px 14px;font-size:12.5px;color:var(--flag);display:flex;flex-direction:column;gap:5px}
.flag b{font-weight:700}

.actions{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.btn{border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12.5px;
  background:var(--surface);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn.ghost{color:var(--ink2)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:6px 12px;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.seg button:hover:not(.on){background:var(--surface2)}
.spacer{flex:1}

.metrics{border-top:1px dashed var(--line);padding-top:13px;display:flex;flex-direction:column;gap:10px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(102px,1fr));gap:8px}
.mfield{display:flex;flex-direction:column;gap:3px}
.mfield label{font-size:11px;color:var(--ink2)}
.mfield input{background:var(--surface2);border:1px solid var(--line);border-radius:7px;
  padding:6px 9px;font-family:"Roboto Mono",monospace;font-size:14px;color:var(--ink);
  font-variant-numeric:tabular-nums;width:100%}
.mfield input:hover{border-color:var(--accent)}
.urlrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.urlrow input{flex:1;min-width:220px;background:var(--surface2);border:1px solid var(--line);
  border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--ink)}
.er{font-family:"Roboto Mono",monospace;font-size:12px;color:var(--ink2);
  font-variant-numeric:tabular-nums}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;
  padding:34px;text-align:center;color:var(--ink2);font-size:13.5px}

.note{border-left:2px solid var(--accent);padding:2px 0 2px 13px;color:var(--ink2);
  font-size:13px;max-width:66ch}
footer{border-top:1px solid var(--line);padding-top:22px;color:var(--ink2);font-size:12.5px;
  display:flex;flex-direction:column;gap:7px}
footer b{color:var(--ink);font-weight:700}

dialog{border:none;padding:0;background:transparent;max-width:min(92vw,720px)}
dialog::backdrop{background:rgba(10,16,13,.72)}
dialog img{width:100%;height:auto;border-radius:14px;display:block}

@media (max-width:640px){
  #root{padding:26px 15px 64px;gap:28px}
  .card{grid-template-columns:1fr}
  .thumb{max-width:220px}
  .when{margin-left:0;width:100%}
}
</style>

<script id="app-data" type="application/json">__DATA__</script>
<script id="app-state" type="application/json">{"chosen":null,"tab":"plan","items":{}}</script>

<script id="app-code">
(function () {
  var FONTS = '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">';

  var DATA  = JSON.parse(document.getElementById('app-data').textContent);
  var state = JSON.parse(document.getElementById('app-state').textContent);

  var STATUS = {
    none:   { label: '未確認',   cls: 'c-none' },
    ok:     { label: '承認',     cls: 'c-ok' },
    hold:   { label: '要修正',   cls: 'c-hold' },
    posted: { label: '投稿済み', cls: 'c-posted' }
  };
  var METRICS = [
    { k: 'imp',  label: 'インプレッション' },
    { k: 'like', label: 'いいね' },
    { k: 'rt',   label: 'リポスト・シェア' },
    { k: 'rep',  label: '返信・コメント' },
    { k: 'prof', label: 'プロフィール表示' },
    { k: 'link', label: 'リンククリック' }
  ];
  var LIMIT = 140;

  var ns = null, mode = 'pending', root = null, editing = null, timer = null;
  var media = {};

  /* ---------- items ---------- */
  var ITEMS = [];
  DATA.launch.forEach(function (d) {
    ITEMS.push({ id: d.id, group: 'launch', name: d.name, hint: d.hint,
      when: '一発目', media: ['x', 'ig'], x: d.text, ig: d.text, tags: DATA.baseTags,
      check: [], img: null });
  });
  DATA.series.forEach(function (p) {
    ITEMS.push({ id: p.id, group: 'series', name: p.name, idx: p.n + ' / 4',
      when: p.when, media: ['x'], x: p.text, ig: '', tags: [], check: [], img: null });
  });
  DATA.days.forEach(function (d) {
    ITEMS.push({ id: d.id, group: 'day', name: d.theme,
      idx: 'DAY ' + (d.day < 10 ? '0' : '') + d.day,
      when: '', media: ['x', 'ig'], x: d.x, ig: d.ig, tags: d.tags,
      check: d.check, img: DATA.images[d.id] || null });
  });
  var BY_ID = {};
  ITEMS.forEach(function (it) { BY_ID[it.id] = it; });

  function rec(id) {
    if (!state.items[id]) { state.items[id] = { status: 'none', m: {} }; }
    if (!state.items[id].m) { state.items[id].m = {}; }
    return state.items[id];
  }
  function textOf(id, med) {
    var r = rec(id), it = BY_ID[id];
    return (r[med] !== undefined && r[med] !== null) ? r[med] : it[med];
  }
  function edited(id, med) {
    var r = state.items[id];
    return !!(r && r[med] !== undefined && r[med] !== null && r[med] !== BY_ID[id][med]);
  }
  function fullText(id, med) {
    var t = textOf(id, med), it = BY_ID[id];
    if (med === 'ig' && it.tags && it.tags.length) {
      t += '\n\n' + it.tags.map(function (x) { return '#' + x; }).join(' ');
    }
    return t;
  }

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function count(t) { return Array.from(t).length; }
  function num(v) { var n = parseInt(v, 10); return isNaN(n) ? 0 : n; }
  function fmt(n) { return n.toLocaleString('ja-JP'); }

  function meter(text, med) {
    if (med === 'ig') {
      return '<div class="meter"><div class="row"><span>' + count(text) +
        ' 字（ハッシュタグ込み）</span><span>Instagram 上限 2,200 字</span></div></div>';
    }
    var c = count(text), over = c > LIMIT;
    var w = Math.min(100, Math.round(c / LIMIT * 100));
    return '<div class="meter' + (over ? ' over' : '') + '">' +
      '<div class="row"><span>' + c + ' 字（改行含む）</span><span>' +
      (over ? '140 字を超過。折りたたまれます' : '目安 ' + LIMIT + ' 字') + '</span></div>' +
      '<div class="track"><div class="fill' + (over ? ' over' : '') +
      '" style="width:' + w + '%"></div></div></div>';
  }

  /* ---------- card ---------- */
  function card(it) {
    var r = rec(it.id);
    var st = r.status || 'none';
    var med = media[it.id] || it.media[0];
    var txt = fullText(it.id, med);
    var isEditing = editing === it.id + ':' + med;

    var cls = 'card' + (it.img ? '' : ' noimg') + (st === 'posted' ? ' done' : '');
    if (it.group === 'launch') {
      if (state.chosen === it.id) { cls += ' chosen'; }
      else if (state.chosen) { cls += ' passed'; }
    }

    var chips = '<span class="chip ' + STATUS[st].cls + '">' + STATUS[st].label + '</span>';
    if (it.group === 'launch' && state.chosen === it.id) {
      chips = '<span class="chip c-pick">採用</span>' + chips;
    } else if (it.group === 'launch' && state.chosen) {
      chips = '<span class="chip c-none">見送り</span>';
    }
    if (edited(it.id, med)) { chips += '<span class="chip c-edit">修正済み</span>'; }

    var mt = it.media.length > 1
      ? '<div class="mediatabs">' + it.media.map(function (m) {
          return '<button data-act="media" data-id="' + it.id + '" data-val="' + m + '"' +
            (m === med ? ' class="on"' : '') + '>' + (m === 'x' ? 'X' : 'Instagram') + '</button>';
        }).join('') + '</div>'
      : '<div class="mediatabs"><button class="on" disabled>X</button></div>';

    var bodyHtml = isEditing
      ? '<textarea data-edit="' + it.id + ':' + med + '">' + esc(textOf(it.id, med)) + '</textarea>' +
        (med === 'ig' && it.tags.length
          ? '<p class="tagline">' + esc(it.tags.map(function (x) { return '#' + x; }).join(' ')) +
            '（ハッシュタグは固定です）</p>' : '') +
        '<div class="actions"><button class="btn primary" data-act="save" data-id="' + it.id +
        '" data-val="' + med + '">保存する</button>' +
        '<button class="btn ghost" data-act="cancel">やめる</button>' +
        (edited(it.id, med)
          ? '<span class="spacer"></span><button class="btn ghost" data-act="reset" data-id="' +
            it.id + '" data-val="' + med + '">元の文面に戻す</button>' : '') +
        '</div>'
      : '<div class="body">' + esc(txt) + '</div>' + meter(txt, med);

    var flags = (it.check && it.check.length)
      ? '<div class="flag"><b>公開前に確認すること</b>' +
        it.check.map(function (c) { return '<span>・' + esc(c) + '</span>'; }).join('') + '</div>'
      : '';

    var hint = it.hint ? '<p class="note">' + esc(it.hint) + '</p>' : '';

    var seg = '<div class="seg" role="group" aria-label="状態">' +
      ['ok', 'hold'].map(function (v) {
        return '<button data-act="status" data-id="' + it.id + '" data-val="' + v + '"' +
          (st === v ? ' class="on"' : '') + '>' + STATUS[v].label + '</button>';
      }).join('') + '</div>';

    var post = st === 'posted'
      ? '<button class="btn ghost" data-act="unpost" data-id="' + it.id + '">投稿前に戻す</button>'
      : '<button class="btn primary" data-act="post" data-id="' + it.id + '">投稿したので記録する</button>';

    var go = med === 'x'
      ? '<a class="btn" target="_blank" rel="noopener" href="https://x.com/intent/post?text=' +
        encodeURIComponent(txt) + '">X の投稿画面をひらく</a>'
      : '<a class="btn" target="_blank" rel="noopener" href="https://www.instagram.com/">Instagram をひらく</a>';

    var acts = isEditing ? '' :
      '<div class="actions">' + seg + post +
      '<button class="btn" data-act="edit" data-id="' + it.id + '" data-val="' + med +
      '">文面を直す</button>' +
      '<button class="btn ghost" data-act="copy" data-id="' + it.id + '" data-val="' + med +
      '">コピー</button>' + go +
      (it.img ? '<button class="btn ghost" data-act="dl" data-id="' + it.id + '">画像を保存</button>' : '') +
      (it.group === 'launch'
        ? (state.chosen === it.id
            ? '<span class="spacer"></span><button class="btn ghost" data-act="pick" data-id="">選び直す</button>'
            : '<span class="spacer"></span><button class="btn" data-act="pick" data-id="' + it.id +
              '">この案で決定</button>')
        : '') +
      '</div>';

    var metrics = st === 'posted' ? metricsBlock(it, r) : '';

    var img = it.img
      ? '<button class="thumb" data-act="zoom" data-id="' + it.id +
        '" aria-label="画像を拡大"><img src="' + it.img + '" alt=""></button>'
      : '';

    return '<article class="' + cls + '">' + img + '<div class="col">' +
      '<div class="cardtop">' +
        (it.idx ? '<span class="idx">' + esc(it.idx) + '</span>' : '') +
        '<span class="name">' + esc(it.name) + '</span>' + chips +
        (it.when ? '<span class="when">' + esc(it.when) + '</span>' : '') +
      '</div>' + mt + bodyHtml + flags + hint + acts + metrics +
      '</div></article>';
  }

  function metricsBlock(it, r) {
    var m = r.m || {};
    var imp = num(m.imp);
    var eng = num(m.like) + num(m.rt) + num(m.rep);
    var er = imp > 0 ? (eng / imp * 100).toFixed(1) + ' %' : '—';
    return '<div class="metrics">' +
      '<div class="mgrid">' + METRICS.map(function (f) {
        return '<div class="mfield"><label for="' + it.id + '-' + f.k + '">' + f.label + '</label>' +
          '<input id="' + it.id + '-' + f.k + '" type="number" min="0" inputmode="numeric" ' +
          'data-metric="' + it.id + ':' + f.k + '" value="' +
          (m[f.k] === undefined || m[f.k] === null || m[f.k] === '' ? '' : esc(m[f.k])) + '"></div>';
      }).join('') + '</div>' +
      '<div class="urlrow">' +
        '<input type="url" placeholder="投稿のURLを貼る（あとで見返すため）" data-url="' + it.id +
        '" value="' + esc(r.url || '') + '">' +
        (r.url ? '<a class="btn ghost" target="_blank" rel="noopener" href="' + esc(r.url) +
          '">ひらく</a>' : '') +
        '<span class="er">エンゲージメント率 ' + er + '</span>' +
      '</div></div>';
  }

  /* ---------- summary ---------- */
  function totals() {
    var t = { imp: 0, like: 0, rt: 0, rep: 0, prof: 0, link: 0, n: 0 };
    ITEMS.forEach(function (it) {
      var r = state.items[it.id];
      if (!r || r.status !== 'posted') { return; }
      t.n++;
      METRICS.forEach(function (f) { t[f.k] += num((r.m || {})[f.k]); });
    });
    return t;
  }

  function tiles() {
    var t = totals();
    var plan = ITEMS.filter(function (it) { return (rec(it.id).status || 'none') !== 'posted'; }).length;
    var ok = ITEMS.filter(function (it) { return rec(it.id).status === 'ok'; }).length;
    var eng = t.like + t.rt + t.rep;
    var er = t.imp > 0 ? (eng / t.imp * 100).toFixed(1) + '%' : '—';
    var rows = [
      [state.chosen ? '案' + state.chosen : '未定', '一発目の採用案'],
      [String(plan), '投稿待ち'],
      [String(ok), '承認済み'],
      [String(t.n), '投稿済み'],
      [t.imp ? fmt(t.imp) : '—', 'インプレッション合計'],
      [er, '平均エンゲージメント率']
    ];
    return '<div class="tiles">' + rows.map(function (x) {
      return '<div class="tile"><span class="n">' + esc(x[0]) + '</span><span class="k">' +
        esc(x[1]) + '</span></div>';
    }).join('') + '</div>';
  }

  /* ---------- view ---------- */
  function group(title, sub, list) {
    if (!list.length) { return ''; }
    return '<section><div class="sechead"><h2>' + esc(title) + '</h2>' +
      (sub ? '<p class="lede">' + esc(sub) + '</p>' : '') + '</div>' +
      '<div class="stack">' + list.map(card).join('') + '</div></section>';
  }

  function planView() {
    var open = function (g) {
      return ITEMS.filter(function (it) {
        return it.group === g && (rec(it.id).status || 'none') !== 'posted';
      });
    };
    var l = open('launch'), s = open('series'), d = open('day');
    if (!l.length && !s.length && !d.length) {
      return '<div class="empty">予定している投稿はありません。</div>';
    }
    return group('一発目の投稿', '3案から1つだけ選びます。X・Instagram共通の文面です。', l) +
      group('24時間テレビ連動シリーズ', '放送のタイミングに紐づくため、順番に意味があります。X のみ。', s) +
      group('10日分のストーリー',
        'Day 1 から順に、びわから基金が何をしている団体かを積み上げていく構成です。X とInstagramで文面を分けています。', d);
  }

  function doneView() {
    var list = ITEMS.filter(function (it) { return rec(it.id).status === 'posted'; });
    if (!list.length) {
      return '<div class="empty">まだ投稿済みの記録がありません。<br>' +
        '投稿したら、そのカードの「投稿したので記録する」を押してください。ここに移動します。</div>';
    }
    return '<section><div class="sechead"><h2>投稿済み</h2>' +
      '<p class="lede">Xは投稿のアナリティクス画面、Instagramはインサイトの数字を手で入れてください。' +
      '外部サービスと自動で連携はしていません。</p></div>' +
      '<div class="stack">' + list.map(card).join('') + '</div></section>';
  }

  function saveBar() {
    var msg = mode === 'saved'
      ? 'この画面での判断と数字は保存され、共有した相手にも同じものが見えます'
      : mode === 'local'
        ? '保存先に接続していないため、変更はこのブラウザにだけ残ります'
        : '保存先を確認しています';
    return '<div class="savebar"><span class="dot"></span>' + esc(msg) + '</div>';
  }

  function view() {
    return '' +
      '<header class="head">' +
        '<span class="eyebrow">Biwakara Fund / Post Desk</span>' +
        '<h1>投稿デスク</h1>' +
        '<p class="lede">これから出す投稿を先に並べ、文面と画像を見ながら直し、承認して、投稿したら数字を記録する。' +
        'この画面が自動で投稿することはありません。投稿ボタンを押すのは人です。</p>' +
        '<div class="accounts">' +
          '<a class="acct" href="https://x.com/biwakara_fund" target="_blank" rel="noopener"><span class="dot"></span><b>X</b><span class="handle">@biwakara_fund</span></a>' +
          '<a class="acct" href="https://www.instagram.com/biwakara_fund/" target="_blank" rel="noopener"><span class="dot"></span><b>Instagram</b><span class="handle">@biwakara_fund</span></a>' +
          '<a class="acct" href="https://biwa.site/" target="_blank" rel="noopener"><b>公式サイト</b><span class="handle">biwa.site</span></a>' +
        '</div>' + saveBar() +
      '</header>' +
      tiles() +
      '<div class="tabs">' +
        '<button data-act="tab" data-val="plan"' + (state.tab === 'plan' ? ' class="on"' : '') + '>これから出す</button>' +
        '<button data-act="tab" data-val="done"' + (state.tab === 'done' ? ' class="on"' : '') + '>投稿済みと数字</button>' +
      '</div>' +
      (state.tab === 'done' ? doneView() : planView()) +
      '<footer>' +
        '<p><b>素材</b>　びわから基金部門 CLAUDE.md 知識アーカイブ／SNS開設完了報告_投稿サンプル選定_2026-08-28.pdf</p>' +
        '<p><b>数字の入れ方</b>　Xは投稿の「アナリティクスを表示」、Instagramは投稿のインサイトから転記します。自動取得にはAPIの契約が必要なため、現状は手入力です。</p>' +
        '<p><b>リンククリックを数えたい場合</b>　プロフィール欄のURLに <code>?utm_source=x&amp;utm_medium=sns</code> のような印をつけると、公式サイト側の解析でどの媒体から来たか分かれます。</p>' +
        '<p><b>運用ルール</b>　この画面は自動投稿をしません。黄色の「公開前に確認すること」が残っている投稿は、確認が取れるまで出さないでください。</p>' +
      '</footer>' +
      '<dialog id="zoom"><img src="" alt=""></dialog>';
  }

  /* ---------- persist ---------- */
  function docSource(st) {
    return '<!doctype html><html lang="ja"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>びわから基金 投稿デスク</title>' + FONTS +
      '<style id="app-style">' + document.getElementById('app-style').textContent + '</style>' +
      '</head><body>' +
      '<script id="app-data" type="application/json">' +
        document.getElementById('app-data').textContent + '<\/script>' +
      '<script id="app-state" type="application/json">' +
        JSON.stringify(st).replace(/</g, '\\u003c') + '<\/script>' +
      '<script id="app-code">' + document.getElementById('app-code').textContent + '<\/script>' +
      '</body></html>';
  }

  function persist() {
    if (timer) { clearTimeout(timer); }
    timer = setTimeout(flush, 900);
  }
  function flush() {
    timer = null;
    if (ns) {
      ns.publish(docSource(state)).catch(function (err) {
        var code = err && err.code;
        if (code === 'conflict' || code === 'rate_limited') { return; }
        if (code === 'not_writer' || code === 'not_granted' ||
            code === 'not_declared' || code === 'capability_disabled') {
          ns = null; mode = 'local'; render();
        }
      });
      return;
    }
    try { localStorage.setItem('biwakara-desk', JSON.stringify(state)); } catch (e) {}
  }

  /* ---------- render ---------- */
  function render() {
    if (!root) {
      root = document.createElement('div');
      root.id = 'root';
      document.body.appendChild(root);
      root.addEventListener('click', onClick);
      root.addEventListener('input', onInput);
      root.addEventListener('change', onInput);
    }
    var focus = document.activeElement;
    var key = focus && (focus.getAttribute('data-metric') || focus.getAttribute('data-url'));
    root.innerHTML = view();
    if (editing) {
      var ta = root.querySelector('textarea[data-edit="' + editing + '"]');
      if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    } else if (key) {
      var back = root.querySelector('[data-metric="' + key + '"],[data-url="' + key + '"]');
      if (back) { back.focus(); }
    }
  }

  function onInput(ev) {
    var t = ev.target;
    var mk = t.getAttribute && t.getAttribute('data-metric');
    if (mk) {
      var p = mk.split(':');
      rec(p[0]).m[p[1]] = t.value === '' ? '' : num(t.value);
      persist();
      var box = t.closest('.metrics');
      if (box) {
        var r = rec(p[0]), m = r.m, imp = num(m.imp);
        var eng = num(m.like) + num(m.rt) + num(m.rep);
        var el = box.querySelector('.er');
        if (el) {
          el.textContent = 'エンゲージメント率 ' +
            (imp > 0 ? (eng / imp * 100).toFixed(1) + ' %' : '—');
        }
      }
      return;
    }
    var uk = t.getAttribute && t.getAttribute('data-url');
    if (uk) { rec(uk).url = t.value.trim(); persist(); }
  }

  function download(it) {
    var name = it.id + '_' + it.name + '.png';
    if (window.__dl) {
      fetch(it.img).then(function (r) { return r.blob(); }).then(function (b) {
        window.__dl.save({ filename: name, data: b });
      });
      return;
    }
    var a = document.createElement('a');
    a.href = it.img; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }

  function onClick(ev) {
    var b = ev.target.closest('button[data-act]');
    if (!b) { return; }
    var act = b.getAttribute('data-act');
    var id = b.getAttribute('data-id');
    var val = b.getAttribute('data-val');

    if (act === 'copy') {
      var old = b.textContent;
      navigator.clipboard.writeText(fullText(id, val)).then(function () {
        b.textContent = 'コピーしました';
        setTimeout(function () { b.textContent = old; }, 1600);
      }).catch(function () {
        b.textContent = 'コピーできません';
        setTimeout(function () { b.textContent = old; }, 2000);
      });
      return;
    }
    if (act === 'zoom') {
      var dlg = document.getElementById('zoom');
      dlg.querySelector('img').src = BY_ID[id].img;
      dlg.showModal();
      dlg.onclick = function () { dlg.close(); };
      return;
    }
    if (act === 'dl') { download(BY_ID[id]); return; }
    if (act === 'media') { media[id] = val; editing = null; render(); return; }
    if (act === 'edit') { editing = id + ':' + val; render(); return; }
    if (act === 'cancel') { editing = null; render(); return; }
    if (act === 'save') {
      var ta = root.querySelector('textarea[data-edit="' + id + ':' + val + '"]');
      if (ta) { rec(id)[val] = ta.value; }
      editing = null; render(); flush(); return;
    }
    if (act === 'reset') { delete rec(id)[val]; editing = null; render(); flush(); return; }
    if (act === 'tab') { state.tab = val; editing = null; render(); persist(); return; }
    if (act === 'status') {
      var r = rec(id);
      r.status = (r.status === val) ? 'none' : val;
    } else if (act === 'post') {
      rec(id).status = 'posted';
    } else if (act === 'unpost') {
      rec(id).status = 'ok';
    } else if (act === 'pick') {
      state.chosen = id || null;
    } else { return; }
    render();
    flush();
  }

  /* ---------- boot ---------- */
  function boot() {
    if (!ns) {
      try {
        var ls = localStorage.getItem('biwakara-desk');
        if (ls) { state = JSON.parse(ls); }
      } catch (e) {}
    }
    render();
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('artifact').then(function (n) {
        ns = n; mode = n ? 'saved' : 'local'; render();
      }).catch(function () { mode = 'local'; render(); });
      window.claude.use('downloads').then(function (d) { window.__dl = d; })
        .catch(function () {});
    } else {
      mode = 'local'; render();
    }
  }

  if (document.body) { boot(); } else { document.addEventListener('DOMContentLoaded', boot); }
})();
</script>
